<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Murthu TechHub LMS</title>
<style>
:root{--bg:#f5f7fb;--card:#fff;--ink:#111827;--muted:#64748b;--brand:#5b5cf0;--brand2:#06b6d4;--line:#e5e7eb;--ok:#16a34a;--warn:#d97706;--danger:#dc2626;--shadow:0 14px 40px rgba(15,23,42,.08)}
*{box-sizing:border-box}body{margin:0;font:15px/1.55 Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,Arial;color:var(--ink);background:var(--bg)}
button,input,select,textarea{font:inherit}.btn{border:0;border-radius:12px;padding:10px 15px;font-weight:700;cursor:pointer;background:#eef2ff;color:#3730a3}.btn.primary{background:linear-gradient(135deg,var(--brand),#7c3aed);color:white}.btn.danger{background:#fee2e2;color:#991b1b}.btn.ghost{background:white;border:1px solid var(--line);color:var(--ink)}.btn:focus,input:focus,select:focus,textarea:focus{outline:3px solid rgba(91,92,240,.18);outline-offset:1px}
.top{height:70px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:18px;padding:0 24px;position:sticky;top:0;z-index:20}.brand{font-size:20px;font-weight:900;letter-spacing:-.5px}.brand span{color:var(--brand)}.top nav{display:flex;gap:8px;flex:1}.top nav button{border:0;background:transparent;padding:9px 10px;cursor:pointer;color:#475569}.search{max-width:330px;width:28%;padding:10px 12px;border:1px solid var(--line);border-radius:12px}.role{padding:9px;border:1px solid var(--line);border-radius:10px;background:white}
.shell{display:grid;grid-template-columns:240px 1fr;min-height:calc(100vh - 70px)}.side{background:#101828;color:#dbe4f0;padding:20px 14px}.side h4{color:#94a3b8;text-transform:uppercase;font-size:11px;letter-spacing:1px;margin:14px 10px 8px}.side button{display:block;width:100%;text-align:left;padding:11px 12px;margin:4px 0;border:0;border-radius:10px;background:transparent;color:inherit;cursor:pointer}.side button:hover,.side button.active{background:#202a3c;color:white}.main{padding:28px;min-width:0}.pagehead{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:22px}.pagehead h1{margin:0;font-size:30px;letter-spacing:-1px}.muted{color:var(--muted)}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;box-shadow:var(--shadow)}.metric b{font-size:28px;display:block}.metric small{color:var(--muted)}.hero{padding:64px 5%;background:radial-gradient(circle at 80% 20%,#cffafe,transparent 28%),linear-gradient(135deg,#eef2ff,#fff);border-radius:24px;margin-bottom:24px}.hero h1{font-size:52px;line-height:1.05;margin:0 0 14px;letter-spacing:-2px}.hero p{font-size:18px;max-width:650px;color:#475569}.coursegrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}.course{padding:0;overflow:hidden}.thumb{height:155px;background:linear-gradient(135deg,#312e81,#06b6d4);display:flex;align-items:end;padding:18px;color:white;font-size:23px;font-weight:900}.course .body{padding:17px}.badge{display:inline-block;padding:4px 8px;border-radius:999px;background:#eef2ff;color:#4338ca;font-size:12px;font-weight:800}.badge.ok{background:#dcfce7;color:#166534}.badge.warn{background:#fef3c7;color:#92400e}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.between{display:flex;justify-content:space-between;align-items:center;gap:12px}.progress{height:9px;background:#e5e7eb;border-radius:99px;overflow:hidden}.progress i{display:block;height:100%;background:linear-gradient(90deg,var(--brand),var(--brand2))}
table{width:100%;border-collapse:collapse;background:white;border-radius:16px;overflow:hidden}th,td{padding:13px;border-bottom:1px solid var(--line);text-align:left}th{font-size:12px;text-transform:uppercase;color:#64748b;background:#f8fafc}.filters{display:flex;gap:10px;margin:0 0 16px;flex-wrap:wrap}.filters input,.filters select,.field input,.field select,.field textarea{border:1px solid var(--line);border-radius:10px;padding:11px;background:white;width:100%}.filters input{max-width:320px}.field{margin-bottom:14px}.field label{display:block;font-weight:750;margin-bottom:6px}.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}.steps{display:flex;gap:6px;overflow:auto;margin-bottom:18px}.step{white-space:nowrap;padding:9px 11px;border-radius:10px;background:#e2e8f0;color:#475569;font-size:13px}.step.on{background:#4f46e5;color:#fff}.builder{border:1px solid var(--line);border-radius:14px;padding:14px;margin:12px 0;background:#fbfdff}.section{margin:10px 0 10px 20px;border-left:3px solid #c7d2fe;padding-left:12px}.lesson{padding:9px 10px;border:1px solid var(--line);background:white;border-radius:9px;margin:7px 0}.modalback{position:fixed;inset:0;background:rgba(15,23,42,.58);display:flex;align-items:center;justify-content:center;padding:18px;z-index:100}.modal{width:min(720px,100%);max-height:90vh;overflow:auto;background:white;border-radius:20px;padding:22px}.toast{position:fixed;right:20px;bottom:20px;background:#111827;color:white;padding:12px 16px;border-radius:12px;z-index:200;box-shadow:var(--shadow)}.player{display:grid;grid-template-columns:1fr 340px;gap:18px}.viewer{min-height:430px;background:#0f172a;color:white;border-radius:18px;padding:28px}.curr{max-height:70vh;overflow:auto}.cert{padding:55px;border:10px double #4338ca;text-align:center;background:white}.cert h1{font-family:Georgia,serif;font-size:42px}.empty{text-align:center;padding:45px;color:#64748b}.chart{height:180px;display:flex;align-items:end;gap:9px;padding-top:20px}.bar{flex:1;background:linear-gradient(#818cf8,#4f46e5);border-radius:8px 8px 0 0;min-height:20px}.mobileMenu{display:none}
@media(max-width:1050px){.grid{grid-template-columns:repeat(2,1fr)}.coursegrid{grid-template-columns:repeat(2,1fr)}.shell{grid-template-columns:200px 1fr}.player{grid-template-columns:1fr}.curr{max-height:none}}
@media(max-width:720px){.top nav,.search{display:none}.mobileMenu{display:block}.shell{display:block}.side{display:none}.side.open{display:block;position:fixed;top:70px;left:0;bottom:0;width:250px;z-index:50;overflow:auto}.main{padding:18px}.grid,.coursegrid,.two{grid-template-columns:1fr}.hero{padding:42px 24px}.hero h1{font-size:40px}.pagehead{align-items:flex-start;flex-direction:column}table{display:block;overflow:auto}}
</style>
</head>
<body>
<header class="top">
<button class="btn ghost mobileMenu" onclick="toggleSide()">☰</button>
<div class="brand">MURTHU <span>TECHHUB</span></div>
<nav><button onclick="go('home')">Home</button><button onclick="go('catalog')">Courses</button><button onclick="go('learning')">My Learning</button><button onclick="go('dashboard')">Dashboard</button></nav>
<input class="search" id="globalSearch" placeholder="Search courses..." onkeydown="if(event.key==='Enter'){state.query=this.value;go('catalog')}">
<select class="role" id="role" onchange="switchRole(this.value)"><option>Student</option><option>Instructor</option><option>Admin</option></select>
</header>
<div class="shell"><aside class="side" id="side"></aside><main class="main" id="app"></main></div>
<div id="overlay"></div><div id="toasts"></div>
<script>
/* ==================== App State & Storage ==================== */
const K='murthu_techhub_lms_v1';
const uid=(p='id')=>p+'_'+Math.random().toString(36).slice(2,9);
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const slug=s=>String(s||'').toLowerCase().trim().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');
const money=n=>'₹'+Number(n||0).toLocaleString('en-IN');
const today=()=>new Date().toISOString().slice(0,10);
const lesson=(title,type='Article',duration=15,required=true,content='Practical lesson content with examples, exercises, and real-world guidance.')=>({id:uid('les'),title,type,duration,required,preview:false,content,videoUrl:'',resourceUrl:''});
function seed(){
 const mk=(title,category,instructor,level,status,priceType,price,rating,students,mods)=>({id:uid('course'),title,slug:slug(title),subtitle:'Build job-ready skills with structured practical learning.',shortDescription:'A practical, project-driven course designed for real-world technology skills.',description:'Learn through guided concepts, hands-on lessons, quizzes and assignments. Progress is tracked throughout the course.',category,subcategory:'Professional',instructor,level,language:'English',thumbnail:'',status,priceType,price,originalPrice:price?price+2000:0,rating,students,duration:mods*4+'h',featured:true,certificateEnabled:true,reviewsEnabled:true,discussionEnabled:true,visibility:'Public',learningOutcomes:['Build practical projects','Understand core concepts','Apply skills in real scenarios'],requirements:['Basic computer knowledge','Curiosity to learn'],tags:[category,'Technology'],modules:Array.from({length:mods},(_,i)=>({id:uid('mod'),title:`Module ${i+1} — ${i?'Core Concepts':'Getting Started'}`,description:'Structured module',sections:[{id:uid('sec'),title:i?'Practical Fundamentals':'Introduction',lessons:[lesson(i?'Core Concepts & Practice':'Course Introduction','Video',18),lesson(i?'Hands-on Workshop':'Environment Setup','Article',22),lesson(i?'Knowledge Check':'First Project','Code Lesson',28)]}],quizzes:i===mods-1?[{id:uid('quiz'),title:'Final Knowledge Check',description:'Test your understanding.',passingScore:60,timeLimit:20,attempts:3,randomize:false,showAnswers:true,questions:[{id:uid('q'),type:'Multiple Choice',text:'Which approach best supports learning?',options:['Practice and feedback','Skip exercises','Memorize only','Avoid projects'],correct:['Practice and feedback'],explanation:'Practice plus feedback reinforces applied understanding.',points:10}]}]:[],assignments:i===1?[{id:uid('asg'),title:'Build a Mini Project',instructions:'Create and submit a small practical project.',dueDate:'',maxMarks:100,passingMarks:50,submissionType:'Text'}]:[]})),createdAt:today(),updatedAt:today(),seoTitle:title,metaDescription:'Learn '+title+' on Murthu TechHub.',keywords:category});
 const courses=[
 mk('ERPNext & Frappe Development Masterclass','ERPNext / Frappe','Murthu Javali','Intermediate','Published','Paid',4999,4.9,1240,4),
 mk('Python Programming from Beginner to Advanced','Python','Ananya Rao','All Levels','Published','Paid',2999,4.8,3420,5),
 mk('Artificial Intelligence Fundamentals','Artificial Intelligence','Arjun Mehta','Beginner','Published','Free',0,4.7,2890,4),
 mk('Full Stack Web Development','Web Development','Priya Sharma','Intermediate','Published','Paid',3999,4.8,2310,5),
 mk('JavaScript Mastery','JavaScript','Vikram Singh','Intermediate','Published','Paid',2499,4.6,1780,4),
 mk('Cloud Computing Essentials','Cloud Computing','Neha Verma','Beginner','Published','Free',0,4.7,1560,3)
 ];
 const users=[{id:'student1',name:'Demo Student',email:'student@murthutechhub.local',role:'Student',bio:'Technology learner',skills:['Python','ERPNext'],interests:['AI','Web Development'],status:'Active'},{id:'inst1',name:'Murthu Javali',email:'instructor@murthutechhub.local',role:'Instructor',status:'Active'},{id:'admin1',name:'TechHub Admin',email:'admin@murthutechhub.local',role:'Admin',status:'Active'}];
 const enrollments=[{id:uid('enr'),studentId:'student1',courseId:courses[1].id,enrolledAt:today(),completedLessons:courses[1].modules[0].sections[0].lessons.slice(0,2).map(x=>x.id),progress:0,status:'Learning'}];
 return {role:'Student',courses,users,enrollments,attempts:[],submissions:[],certificates:[],notifications:[{id:uid('n'),text:'Welcome to Murthu TechHub',date:today()}],categories:['ERPNext / Frappe','Python','Artificial Intelligence','Web Development','JavaScript','Cloud Computing','Data Science','Career Skills'],settings:{platform:'Murthu TechHub',support:'support@murthutechhub.local',language:'English',currency:'INR',enrollment:true,certificates:true,notifications:true}};
}
let db=JSON.parse(localStorage.getItem(K)||'null')||seed(); let state={page:'home',query:'',selected:null,wizard:null,wstep:0,currentLesson:null};
function save(){localStorage.setItem(K,JSON.stringify(db))}
function toast(t){document.getElementById('toasts').innerHTML=`<div class="toast">${esc(t)}</div>`;setTimeout(()=>document.getElementById('toasts').innerHTML='',2200)}
function switchRole(r){db.role=r;save();go(r==='Student'?'dashboard':'dashboard');toast('Demo role switched to '+r)}
function toggleSide(){document.getElementById('side').classList.toggle('open')}

/* ==================== Router & Navigation ==================== */
function go(p,id=null){state.page=p;state.selected=id;render();window.scrollTo({top:0,behavior:'smooth'});document.getElementById('side').classList.remove('open')}
function navButton(label,p){return `<button class="${state.page===p?'active':''}" onclick="go('${p}')">${label}</button>`}
function sidebar(){
 let s='<h4>Workspace</h4>';
 if(db.role==='Admin')s+=navButton('Dashboard','dashboard')+navButton('Courses','manage')+navButton('Create Course','create')+navButton('Students','students')+navButton('Instructors','instructors')+navButton('Enrollments','enrollments')+navButton('Categories','categories')+navButton('Assignments','assignments')+navButton('Quizzes','quizzes')+navButton('Certificates','certificates')+navButton('Analytics','analytics')+navButton('Settings','settings');
 else if(db.role==='Instructor')s+=navButton('Dashboard','dashboard')+navButton('My Courses','manage')+navButton('Create Course','create')+navButton('Students','students')+navButton('Assignments','assignments')+navButton('Quiz Results','quizzes')+navButton('Course Analytics','analytics');
 else s+=navButton('Student Dashboard','dashboard')+navButton('Browse Courses','catalog')+navButton('My Learning','learning')+navButton('Certificates','certificates')+navButton('Profile','profile');
 s+='<h4>Public</h4>'+navButton('Home','home')+navButton('Course Catalog','catalog');
 document.getElementById('side').innerHTML=s;document.getElementById('role').value=db.role;
}
function render(){sidebar();const map={home:home,catalog:catalog,detail:detail,dashboard:dashboard,manage:manage,create:createWizard,learning:learning,player:player,students:students,enrollments:enrollments,analytics:analytics,certificates:certificates,profile:profile,settings:settings,categories:categories,instructors:instructors,assignments:assignments,quizzes:quizzes};(map[state.page]||home)()}

/* ==================== Public Website & Catalog ==================== */
function courseCard(c){
 const e=db.enrollments.find(x=>x.courseId===c.id&&x.studentId==='student1');calcProgress(e,c);
 return `<article class="card course"><div class="thumb">${esc(c.category)}</div><div class="body"><div class="between"><span class="badge">${esc(c.level)}</span><b>${c.priceType==='Free'?'Free':money(c.price)}</b></div><h3>${esc(c.title)}</h3><div class="muted">${esc(c.instructor)} · ★ ${c.rating} · ${c.students.toLocaleString('en-IN')} learners</div><p>${esc(c.shortDescription)}</p>${e?`<div class="progress"><i style="width:${e.progress}%"></i></div><small>${e.progress}% complete</small>`:''}<div style="margin-top:14px"><button class="btn primary" onclick="go('detail','${c.id}')">View Course</button></div></div></article>`
}
function home(){
 const pub=db.courses.filter(c=>c.status==='Published');
 app.innerHTML=`<section class="hero"><span class="badge">MURTHU TECHHUB LMS</span><h1>Learn. Build. Grow.</h1><p>Master real-world technology skills through structured, practical learning.</p><div class="row"><button class="btn primary" onclick="go('catalog')">Explore Courses</button><button class="btn ghost" onclick="go('learning')">Start Learning</button></div><p><b>Create. Publish. Learn. Track. Complete.</b></p></section>
 <div class="pagehead"><div><h1>Featured Courses</h1><div class="muted">Practical programs built for career growth.</div></div></div><section class="coursegrid">${pub.slice(0,3).map(courseCard).join('')}</section>
 <div class="pagehead" style="margin-top:34px"><div><h1>Top Categories</h1></div></div><div class="grid">${db.categories.slice(0,8).map(x=>`<div class="card"><b>${esc(x)}</b><div class="muted">${pub.filter(c=>c.category===x).length} courses</div></div>`).join('')}</div>
 <section class="card" style="margin-top:28px"><div class="grid"><div class="metric"><b>${pub.length}+</b><small>Expert courses</small></div><div class="metric"><b>13K+</b><small>Learners</small></div><div class="metric"><b>4.8/5</b><small>Average rating</small></div><div class="metric"><b>100%</b><small>Practical focus</small></div></div></section>
 <section class="card" style="margin-top:20px"><h2>Why Murthu TechHub</h2><p class="muted">Structured learning paths, practical lessons, quizzes, assignments, progress tracking, and completion certificates — in one focused learning experience.</p></section>`;
}
function catalog(){
 let cs=db.courses.filter(c=>c.status==='Published');let q=(state.query||'').toLowerCase();if(q)cs=cs.filter(c=>(c.title+c.category+c.instructor).toLowerCase().includes(q));
 app.innerHTML=`<div class="pagehead"><div><h1>Course Catalog</h1><div class="muted">Explore practical technology courses.</div></div></div><div class="filters"><input id="cq" value="${esc(state.query)}" placeholder="Search courses..." oninput="state.query=this.value;catalog()"><select id="cat" onchange="filterCatalog()"><option value="">All Categories</option>${db.categories.map(x=>`<option>${esc(x)}</option>`).join('')}</select><select id="lvl" onchange="filterCatalog()"><option value="">All Levels</option><option>Beginner</option><option>Intermediate</option><option>Advanced</option><option>All Levels</option></select><select id="sort" onchange="filterCatalog()"><option>Most Popular</option><option>Newest</option><option>Highest Rated</option><option>A-Z</option></select></div><div id="catalogGrid" class="coursegrid">${cs.map(courseCard).join('')}</div>`;
}
function filterCatalog(){let q=document.getElementById('cq').value.toLowerCase(),cat=document.getElementById('cat').value,lvl=document.getElementById('lvl').value,sort=document.getElementById('sort').value;let cs=db.courses.filter(c=>c.status==='Published'&&(!q||(c.title+c.category+c.instructor).toLowerCase().includes(q))&&(!cat||c.category===cat)&&(!lvl||c.level===lvl));if(sort==='Most Popular')cs.sort((a,b)=>b.students-a.students);if(sort==='Highest Rated')cs.sort((a,b)=>b.rating-a.rating);if(sort==='A-Z')cs.sort((a,b)=>a.title.localeCompare(b.title));document.getElementById('catalogGrid').innerHTML=cs.length?cs.map(courseCard).join(''):'<div class="card empty">No courses match your filters.</div>'}
function detail(){
 const c=db.courses.find(x=>x.id===state.selected);if(!c)return go('catalog');const e=db.enrollments.find(x=>x.courseId===c.id&&x.studentId==='student1');calcProgress(e,c);
 app.innerHTML=`<div class="card" style="background:linear-gradient(135deg,#111827,#312e81);color:white"><span class="badge">${esc(c.category)}</span><h1>${esc(c.title)}</h1><p>${esc(c.subtitle)}</p><div class="row"><span>★ ${c.rating}</span><span>${c.students.toLocaleString('en-IN')} students</span><span>${esc(c.duration)}</span><span>${esc(c.level)}</span></div><p>Instructor: <b>${esc(c.instructor)}</b> · Language: ${esc(c.language)} · Certificate: ${c.certificateEnabled?'Yes':'No'}</p>${e?`<button class="btn primary" onclick="openPlayer('${c.id}')">Continue Learning · ${e.progress}%</button>`:`<button class="btn primary" onclick="enroll('${c.id}')">${c.priceType==='Free'?'Enroll Free':'Enroll · '+money(c.price)}</button>`}</div>
 <div class="two" style="margin-top:18px"><div><section class="card"><h2>What you'll learn</h2>${c.learningOutcomes.map(x=>`<p>✓ ${esc(x)}</p>`).join('')}</section><section class="card" style="margin-top:16px"><h2>Curriculum</h2>${curriculumHTML(c,false)}</section></div><div><section class="card"><h2>About this course</h2><p>${esc(c.description)}</p><h3>Requirements</h3>${c.requirements.map(x=>`<p>• ${esc(x)}</p>`).join('')}<h3>Instructor</h3><p><b>${esc(c.instructor)}</b><br><span class="muted">Technology instructor focused on practical learning.</span></p></section><section class="card" style="margin-top:16px"><h2>FAQ</h2><details><summary>Do I receive a certificate?</summary><p>${c.certificateEnabled?'Yes, after completing the course requirements.':'This course does not currently issue a certificate.'}</p></details><details><summary>Can I learn at my own pace?</summary><p>Yes. Progress is saved locally in this prototype.</p></details></section></div></div>`;
}
function enroll(id){if(db.role!=='Student'){toast('Switch to Student role to enroll');return}if(!db.enrollments.some(e=>e.courseId===id&&e.studentId==='student1'))db.enrollments.push({id:uid('enr'),studentId:'student1',courseId:id,enrolledAt:today(),completedLessons:[],progress:0,status:'Learning'});save();toast('Enrollment successful');detail()}

/* ==================== Dashboards ==================== */
function dashboard(){db.role==='Admin'?adminDash():db.role==='Instructor'?instructorDash():studentDash()}
function adminDash(){
 const pub=db.courses.filter(c=>c.status==='Published').length,draft=db.courses.filter(c=>c.status==='Draft').length;
 app.innerHTML=`<div class="pagehead"><div><h1>Admin Dashboard</h1><div class="muted">Platform performance and learning activity.</div></div><button class="btn primary" onclick="go('create')">+ Create Course</button></div><div class="grid">${[['Total Courses',db.courses.length],['Published',pub],['Drafts',draft],['Students',db.users.filter(u=>u.role==='Student').length],['Active Learners',db.enrollments.filter(e=>e.status==='Learning').length],['Enrollments',db.enrollments.length],['Completions',db.enrollments.filter(e=>e.status==='Completed').length],['Certificates',db.certificates.length]].map(x=>`<div class="card metric"><small>${x[0]}</small><b>${x[1]}</b></div>`).join('')}</div><div class="two" style="margin-top:18px"><div class="card"><h2>Enrollment Trend</h2><div class="chart">${[35,58,42,76,65,88,72,94].map(x=>`<i class="bar" style="height:${x}%"></i>`).join('')}</div></div><div class="card"><h2>Popular Courses</h2>${db.courses.slice().sort((a,b)=>b.students-a.students).slice(0,5).map(c=>`<p class="between"><span>${esc(c.title)}</span><b>${c.students.toLocaleString('en-IN')}</b></p>`).join('')}</div></div><div class="card" style="margin-top:18px"><h2>Recent Enrollments</h2>${enrollmentTable(db.enrollments.slice(-5))}</div>`;
}
function instructorDash(){let cs=db.courses.filter(c=>c.instructor==='Murthu Javali');app.innerHTML=`<div class="pagehead"><div><h1>Instructor Dashboard</h1><div class="muted">Manage teaching, learners and course performance.</div></div><button class="btn primary" onclick="go('create')">Create Course</button></div><div class="grid"><div class="card metric"><small>My Courses</small><b>${cs.length}</b></div><div class="card metric"><small>Students</small><b>${cs.reduce((a,c)=>a+c.students,0).toLocaleString('en-IN')}</b></div><div class="card metric"><small>Assignments</small><b>${allAssignments().length}</b></div><div class="card metric"><small>Quiz Attempts</small><b>${db.attempts.length}</b></div></div><div class="coursegrid" style="margin-top:18px">${cs.map(courseCard).join('')}</div>`}
function studentDash(){let es=db.enrollments.filter(e=>e.studentId==='student1');app.innerHTML=`<div class="pagehead"><div><h1>Welcome back, Demo Student</h1><div class="muted">Keep building your skills.</div></div></div><div class="grid"><div class="card metric"><small>My Courses</small><b>${es.length}</b></div><div class="card metric"><small>Completed</small><b>${es.filter(e=>e.status==='Completed').length}</b></div><div class="card metric"><small>Learning Hours</small><b>${Math.round(es.reduce((a,e)=>a+e.completedLessons.length*.35,0))}</b></div><div class="card metric"><small>Certificates</small><b>${db.certificates.filter(c=>c.studentId==='student1').length}</b></div></div><h2 style="margin-top:28px">Continue Learning</h2><div class="coursegrid">${es.map(e=>{let c=db.courses.find(x=>x.id===e.courseId);return c?courseCard(c):''}).join('')||'<div class="card empty">No enrollments yet. Browse the catalog to start learning.</div>'}</div>`}

/* ==================== Course Management ==================== */
function manage(){let cs=db.courses;app.innerHTML=`<div class="pagehead"><div><h1>${db.role==='Instructor'?'My Courses':'Course Management'}</h1><div class="muted">Create, edit, preview and publish learning content.</div></div><button class="btn primary" onclick="go('create')">+ Create Course</button></div><div class="filters"><input id="mq" placeholder="Search courses" oninput="manageFilter()"><select id="ms" onchange="manageFilter()"><option value="">All Status</option><option>Published</option><option>Draft</option><option>Archived</option></select></div><div id="manageTable">${courseTable(cs)}</div>`}
function courseTable(cs){return `<table><thead><tr><th>Course</th><th>Instructor</th><th>Students</th><th>Lessons</th><th>Status</th><th>Updated</th><th>Actions</th></tr></thead><tbody>${cs.map(c=>`<tr><td><b>${esc(c.title)}</b><br><span class="muted">${esc(c.category)}</span></td><td>${esc(c.instructor)}</td><td>${c.students}</td><td>${flatLessons(c).length}</td><td><span class="badge ${c.status==='Published'?'ok':c.status==='Draft'?'warn':''}">${c.status}</span></td><td>${c.updatedAt}</td><td><div class="row"><button class="btn ghost" onclick="editCourse('${c.id}')">Edit</button><button class="btn ghost" onclick="go('detail','${c.id}')">Preview</button><button class="btn" onclick="togglePublish('${c.id}')">${c.status==='Published'?'Unpublish':'Publish'}</button><button class="btn ghost" onclick="duplicateCourse('${c.id}')">Duplicate</button><button class="btn danger" onclick="deleteCourse('${c.id}')">Delete</button></div></td></tr>`).join('')}</tbody></table>`}
function manageFilter(){let q=mq.value.toLowerCase(),s=ms.value;manageTable.innerHTML=courseTable(db.courses.filter(c=>(!q||c.title.toLowerCase().includes(q))&&(!s||c.status===s)))}
function togglePublish(id){let c=db.courses.find(x=>x.id===id);c.status=c.status==='Published'?'Draft':'Published';c.updatedAt=today();save();toast('Course '+c.status);manage()}
function duplicateCourse(id){let c=structuredClone(db.courses.find(x=>x.id===id));c.id=uid('course');c.title+=' Copy';c.slug=slug(c.title);c.status='Draft';c.createdAt=c.updatedAt=today();db.courses.push(c);save();toast('Course duplicated');manage()}
function deleteCourse(id){confirmBox('Delete this course? This removes its demo enrollments too.',()=>{db.courses=db.courses.filter(c=>c.id!==id);db.enrollments=db.enrollments.filter(e=>e.courseId!==id);save();toast('Course deleted');manage()})}
function editCourse(id){state.wizard=structuredClone(db.courses.find(c=>c.id===id));state.wstep=0;go('create')}

/* ==================== Course Builder ==================== */
const stepNames=['Basic Information','Course Details','Curriculum','Pricing','Settings','SEO','Preview & Publish'];
function newCourse(){return {id:uid('course'),title:'',slug:'',subtitle:'',shortDescription:'',description:'',category:'Python',subcategory:'',instructor:'Murthu Javali',level:'Beginner',language:'English',thumbnail:'',promoVideo:'',status:'Draft',priceType:'Free',price:0,originalPrice:0,learningOutcomes:['Build practical skills'],requirements:['Basic computer knowledge'],targetAudience:'Learners and professionals',estimatedDuration:'4 hours',certificateEnabled:true,featured:false,enrollmentLimit:0,startDate:'',endDate:'',modules:[],enrollmentEnabled:true,reviewsEnabled:true,discussionEnabled:true,visibility:'Public',drip:'Disabled',prerequisite:'',maxStudents:0,completionRequirement:'All required lessons',seoTitle:'',metaDescription:'',keywords:'',socialTitle:'',socialDescription:'',createdAt:today(),updatedAt:today(),rating:0,students:0,tags:[]}}
function createWizard(){if(!state.wizard)state.wizard=newCourse();let c=state.wizard;app.innerHTML=`<div class="pagehead"><div><h1>Course Builder</h1><div class="muted">Create a complete publish-ready course.</div></div><button class="btn ghost" onclick="saveDraft()">Save Draft</button></div><div class="steps">${stepNames.map((x,i)=>`<div class="step ${i===state.wstep?'on':''}" onclick="wizardStep(${i})">${i+1}. ${x}</div>`).join('')}</div><div class="card" id="wizardBody">${wizardBody(c)}</div><div class="between" style="margin-top:15px"><button class="btn ghost" ${state.wstep===0?'disabled':''} onclick="wizardStep(${state.wstep-1})">Previous</button><span class="muted">Step ${state.wstep+1} of 7</span><button class="btn primary" ${state.wstep===6?'disabled':''} onclick="wizardStep(${state.wstep+1})">Next</button></div>`}
function syncForm(){document.querySelectorAll('[data-k]').forEach(el=>{let k=el.dataset.k;state.wizard[k]=el.type==='checkbox'?el.checked:el.value});state.wizard.slug=state.wizard.slug||slug(state.wizard.title)}
function wizardStep(i){syncForm();state.wstep=Math.max(0,Math.min(6,i));createWizard()}
function inp(label,k,type='text'){let c=state.wizard;return `<div class="field"><label>${label}</label><input data-k="${k}" type="${type}" value="${esc(c[k])}" ${k==='title'?`oninput="state.wizard.title=this.value;state.wizard.slug=slug(this.value)"`:''}></div>`}
function ta(label,k){return `<div class="field"><label>${label}</label><textarea data-k="${k}" rows="5">${esc(state.wizard[k])}</textarea></div>`}
function sel(label,k,opts){return `<div class="field"><label>${label}</label><select data-k="${k}">${opts.map(o=>`<option ${state.wizard[k]===o?'selected':''}>${esc(o)}</option>`).join('')}</select></div>`}
function wizardBody(c){
 if(state.wstep===0)return `<h2>Basic Information</h2><div class="two">${inp('Course Title *','title')}${inp('Course Slug','slug')}${inp('Subtitle','subtitle')}${sel('Category','category',db.categories)}${sel('Instructor','instructor',db.users.filter(u=>u.role==='Instructor').map(u=>u.name))}${sel('Level','level',['Beginner','Intermediate','Advanced','All Levels'])}${sel('Language','language',['English','Telugu','Hindi'])}${inp('Thumbnail URL / placeholder','thumbnail')}${inp('Promotional Video URL','promoVideo')}${inp('Tags','keywords')}</div>${ta('Short Description','shortDescription')}${ta('Full Description','description')}`;
 if(state.wstep===1)return `<h2>Course Details</h2>${listEditor('Learning Outcomes','learningOutcomes')}${listEditor('Requirements','requirements')}${ta('Target Audience','targetAudience')}<div class="two">${inp('Estimated Duration','estimatedDuration')}${inp('Enrollment Limit','enrollmentLimit','number')}${inp('Course Start Date','startDate','date')}${inp('Course End Date','endDate','date')}</div><label><input data-k="certificateEnabled" type="checkbox" ${c.certificateEnabled?'checked':''}> Certificate Enabled</label> &nbsp; <label><input data-k="featured" type="checkbox" ${c.featured?'checked':''}> Featured Course</label>`;
 if(state.wstep===2)return `<div class="between"><div><h2>Curriculum Builder</h2><div class="muted">Course → Module → Section → Lesson / Quiz / Assignment</div></div><button class="btn primary" onclick="addModule()">+ Add Module</button></div>${c.modules.length?curriculumHTML(c,true):'<div class="empty">No curriculum yet. Add your first module.</div>'}`;
 if(state.wstep===3)return `<h2>Pricing</h2>${sel('Course Type','priceType',['Free','Paid'])}<div class="two">${inp('Original Price (₹)','originalPrice','number')}${inp('Selling Price (₹)','price','number')}</div><p class="muted">Discount preview: ${c.originalPrice>0?Math.max(0,Math.round((1-c.price/c.originalPrice)*100)):0}%</p>`;
 if(state.wstep===4)return `<h2>Course Settings</h2><div class="two">${sel('Visibility','visibility',['Public','Private','Unlisted'])}${sel('Drip Content','drip',['Disabled','By Date','After Enrollment'])}${inp('Prerequisite Course','prerequisite')}${inp('Maximum Students','maxStudents','number')}${sel('Completion Requirement','completionRequirement',['80% lessons completed','All required lessons','Quiz passing requirement'])}</div><p><label><input data-k="enrollmentEnabled" type="checkbox" ${c.enrollmentEnabled?'checked':''}> Enrollment Enabled</label></p><p><label><input data-k="reviewsEnabled" type="checkbox" ${c.reviewsEnabled?'checked':''}> Reviews Enabled</label></p><p><label><input data-k="discussionEnabled" type="checkbox" ${c.discussionEnabled?'checked':''}> Discussion Enabled</label></p>`;
 if(state.wstep===5)return `<h2>SEO</h2>${inp('SEO Title','seoTitle')}${ta('Meta Description','metaDescription')}${inp('Keywords','keywords')}${inp('Slug','slug')}${inp('Social Sharing Title','socialTitle')}${ta('Social Sharing Description','socialDescription')}<div class="card"><small class="muted">Search preview</small><h3 style="color:#1d4ed8">${esc(c.seoTitle||c.title||'Course title')}</h3><div>${esc(c.metaDescription||c.shortDescription||'Course description will appear here.')}</div></div>`;
 let checks=[['Course title',!!c.title],['Description',!!(c.description||c.shortDescription)],['Instructor',!!c.instructor],['Curriculum',c.modules.length>0],['At least one lesson',flatLessons(c).length>0],['Pricing configured',c.priceType==='Free'||Number(c.price)>0]];
 return `<h2>Preview & Publish</h2><div class="two"><div><h3>${esc(c.title||'Untitled Course')}</h3><p>${esc(c.shortDescription)}</p><p><span class="badge">${c.status}</span> · ${esc(c.category)} · ${esc(c.level)}</p><p><b>${c.priceType==='Free'?'Free':money(c.price)}</b></p></div><div><h3>Readiness Checklist</h3>${checks.map(x=>`<p>${x[1]?'✓':'✕'} ${x[0]}</p>`).join('')}</div></div><div class="row"><button class="btn ghost" onclick="saveDraft()">Save Draft</button><button class="btn ghost" onclick="previewWizard()">Preview Course</button><button class="btn primary" onclick="publishWizard()">Publish Course</button></div>`;
}
function listEditor(label,k){return `<div class="field"><label>${label}</label>${state.wizard[k].map((x,i)=>`<div class="row"><input style="flex:1" value="${esc(x)}" onchange="state.wizard['${k}'][${i}]=this.value"><button class="btn danger" onclick="state.wizard['${k}'].splice(${i},1);createWizard()">Remove</button></div>`).join('')}<button class="btn ghost" onclick="state.wizard['${k}'].push('');createWizard()">+ Add ${label.replace(/s$/,'')}</button></div>`}
function saveDraft(){syncForm();let c=state.wizard;if(!c.title){toast('Course title is required');return}c.status='Draft';persistWizard();toast('Draft saved')}
function persistWizard(){let i=db.courses.findIndex(x=>x.id===state.wizard.id);state.wizard.updatedAt=today();if(i>=0)db.courses[i]=structuredClone(state.wizard);else db.courses.push(structuredClone(state.wizard));save()}
function publishWizard(){syncForm();let c=state.wizard;if(!c.title||!c.instructor||!c.modules.length||!flatLessons(c).length){toast('Complete title, instructor, curriculum and at least one lesson');return}if(c.priceType==='Paid'&&!Number(c.price)){toast('Set a selling price');return}c.status='Published';persistWizard();toast('Course Published Successfully');let id=c.id;state.wizard=null;go('detail',id)}
function previewWizard(){syncForm();persistWizard();let id=state.wizard.id;go('detail',id)}
function addModule(){state.wizard.modules.push({id:uid('mod'),title:'New Module',description:'',sections:[],quizzes:[],assignments:[]});createWizard()}
function addSection(mi){state.wizard.modules[mi].sections.push({id:uid('sec'),title:'New Section',lessons:[]});createWizard()}
function curriculumHTML(c,edit){return c.modules.map((m,mi)=>`<div class="builder"><div class="between"><h3>${esc(m.title)}</h3>${edit?`<div class="row"><button class="btn ghost" onclick="renameItem('module',${mi})">Edit</button><button class="btn ghost" onclick="moveModule(${mi},-1)">↑</button><button class="btn ghost" onclick="moveModule(${mi},1)">↓</button><button class="btn danger" onclick="removeModule(${mi})">Delete</button></div>`:''}</div>${m.sections.map((s,si)=>`<div class="section"><div class="between"><b>${esc(s.title)}</b>${edit?`<div class="row"><button class="btn ghost" onclick="renameItem('section',${mi},${si})">Edit</button><button class="btn" onclick="lessonModal(${mi},${si})">+ Lesson</button></div>`:''}</div>${s.lessons.map((l,li)=>`<div class="lesson between"><span>${esc(l.type)} · <b>${esc(l.title)}</b> · ${l.duration} min</span>${edit?`<div class="row"><button class="btn ghost" onclick="lessonModal(${mi},${si},${li})">Edit</button><button class="btn ghost" onclick="moveLesson(${mi},${si},${li},-1)">↑</button><button class="btn ghost" onclick="moveLesson(${mi},${si},${li},1)">↓</button><button class="btn danger" onclick="removeLesson(${mi},${si},${li})">Delete</button></div>`:''}</div>`).join('')}</div>`).join('')}${(m.quizzes||[]).map((q,qi)=>`<div class="lesson between"><span>Quiz · <b>${esc(q.title)}</b> · ${q.questions.length} questions</span>${edit?`<button class="btn ghost" onclick="quizModal(${mi},${qi})">Edit Quiz</button>`:''}</div>`).join('')}${(m.assignments||[]).map(a=>`<div class="lesson">Assignment · <b>${esc(a.title)}</b></div>`).join('')}${edit?`<div class="row"><button class="btn" onclick="addSection(${mi})">+ Add Section</button><button class="btn" onclick="quizModal(${mi})">+ Add Quiz</button><button class="btn" onclick="assignmentModal(${mi})">+ Add Assignment</button></div>`:''}</div>`).join('')}
function renameItem(type,mi,si){let o=type==='module'?state.wizard.modules[mi]:state.wizard.modules[mi].sections[si];let n=prompt('Enter title',o.title);if(n){o.title=n;createWizard()}}
function moveModule(i,d){let a=state.wizard.modules,j=i+d;if(j<0||j>=a.length)return;[a[i],a[j]]=[a[j],a[i]];createWizard()}
function removeModule(i){confirmBox('Delete this module?',()=>{state.wizard.modules.splice(i,1);createWizard()})}
function moveLesson(mi,si,li,d){let a=state.wizard.modules[mi].sections[si].lessons,j=li+d;if(j<0||j>=a.length)return;[a[li],a[j]]=[a[j],a[li]];createWizard()}
function removeLesson(mi,si,li){state.wizard.modules[mi].sections[si].lessons.splice(li,1);createWizard()}

/* ==================== Modals: Lessons, Quizzes, Assignments ==================== */
function modal(html){overlay.innerHTML=`<div class="modalback" onclick="if(event.target===this)closeModal()"><div class="modal">${html}</div></div>`}
function closeModal(){overlay.innerHTML=''}
function confirmBox(msg,yes){modal(`<h2>Confirm action</h2><p>${esc(msg)}</p><div class="row"><button class="btn ghost" onclick="closeModal()">Cancel</button><button class="btn danger" id="confirmYes">Confirm</button></div>`);confirmYes.onclick=()=>{closeModal();yes()}}
function lessonModal(mi,si,li=null){let l=li===null?lesson('','Video',15):state.wizard.modules[mi].sections[si].lessons[li];modal(`<h2>${li===null?'Add':'Edit'} Lesson</h2><div class="field"><label>Lesson Title</label><input id="lt" value="${esc(l.title)}"></div><div class="field"><label>Lesson Type</label><select id="ltype">${['Video','Article','PDF','Document','External Link','Code Lesson','Live Session'].map(x=>`<option ${l.type===x?'selected':''}>${x}</option>`).join('')}</select></div><div class="field"><label>Description / Content</label><div class="row" style="padding:8px;background:#f1f5f9;border-radius:8px"><b>B</b><i>I</i><span>H1</span><span>Link</span><span>Code</span></div><textarea id="lc" rows="7">${esc(l.content)}</textarea></div><div class="two"><div class="field"><label>Video URL</label><input id="lv" value="${esc(l.videoUrl)}"></div><div class="field"><label>Resource URL / File placeholder</label><input id="lr" value="${esc(l.resourceUrl)}"></div><div class="field"><label>Duration (minutes)</label><input id="ld" type="number" value="${l.duration}"></div></div><p><label><input id="lp" type="checkbox" ${l.preview?'checked':''}> Free Preview</label> &nbsp; <label><input id="lreq" type="checkbox" ${l.required?'checked':''}> Required</label></p><div class="row"><button class="btn ghost" onclick="closeModal()">Cancel</button><button class="btn primary" onclick="saveLesson(${mi},${si},${li===null?'null':li})">Save Lesson</button></div>`)}
function saveLesson(mi,si,li){if(!lt.value.trim()){toast('Lesson title is required');return}let l={id:li===null?uid('les'):state.wizard.modules[mi].sections[si].lessons[li].id,title:lt.value.trim(),type:ltype.value,content:lc.value,videoUrl:lv.value,resourceUrl:lr.value,duration:Number(ld.value)||0,preview:lp.checked,required:lreq.checked};if(li===null)state.wizard.modules[mi].sections[si].lessons.push(l);else state.wizard.modules[mi].sections[si].lessons[li]=l;closeModal();createWizard()}
function quizModal(mi,qi=null){let q=qi===null?{id:uid('quiz'),title:'New Quiz',description:'',passingScore:60,timeLimit:20,attempts:3,randomize:false,showAnswers:true,questions:[]}:state.wizard.modules[mi].quizzes[qi];modal(`<h2>Quiz Builder</h2><div class="two"><div class="field"><label>Quiz Title</label><input id="qt" value="${esc(q.title)}"></div><div class="field"><label>Passing Score %</label><input id="qpass" type="number" value="${q.passingScore}"></div><div class="field"><label>Time Limit</label><input id="qtime" type="number" value="${q.timeLimit}"></div><div class="field"><label>Attempts Allowed</label><input id="qattempt" type="number" value="${q.attempts}"></div></div><div class="field"><label>Description</label><textarea id="qd">${esc(q.description)}</textarea></div><h3>Questions</h3><div id="qQuestions">${q.questions.map((x,i)=>`<div class="lesson">${i+1}. ${esc(x.text)} <span class="muted">(${x.type})</span></div>`).join('')||'<p class="muted">No questions yet.</p>'}</div><button class="btn" onclick="addQuestionInline()">+ Add Question</button><div class="row" style="margin-top:18px"><button class="btn ghost" onclick="closeModal()">Cancel</button><button class="btn primary" id="saveQuizBtn">Save Quiz</button></div>`);let temp=structuredClone(q);window._tempQuiz=temp;saveQuizBtn.onclick=()=>{temp.title=qt.value;temp.description=qd.value;temp.passingScore=Number(qpass.value);temp.timeLimit=Number(qtime.value);temp.attempts=Number(qattempt.value);if(qi===null)state.wizard.modules[mi].quizzes.push(temp);else state.wizard.modules[mi].quizzes[qi]=temp;closeModal();createWizard()}}
function addQuestionInline(){let text=prompt('Question text');if(!text)return;let opts=['Option A','Option B','Option C','Option D'];let correct=prompt('Correct answer (exact option text)',opts[0])||opts[0];_tempQuiz.questions.push({id:uid('q'),type:'Multiple Choice',text,options:opts,correct:[correct],explanation:'Review the lesson for the explanation.',points:10});qQuestions.innerHTML=_tempQuiz.questions.map((x,i)=>`<div class="lesson">${i+1}. ${esc(x.text)} <span class="muted">(${x.type})</span></div>`).join('')}
function assignmentModal(mi){modal(`<h2>Add Assignment</h2><div class="field"><label>Title</label><input id="at"></div><div class="field"><label>Instructions</label><textarea id="ai"></textarea></div><div class="two"><div class="field"><label>Due Date</label><input id="ad" type="date"></div><div class="field"><label>Maximum Marks</label><input id="am" type="number" value="100"></div><div class="field"><label>Passing Marks</label><input id="ap" type="number" value="50"></div><div class="field"><label>Submission Type</label><select id="ast"><option>Text</option><option>File</option><option>URL</option></select></div></div><button class="btn primary" onclick="saveAssignment(${mi})">Save Assignment</button>`)}
function saveAssignment(mi){if(!at.value)return toast('Assignment title required');state.wizard.modules[mi].assignments.push({id:uid('asg'),title:at.value,instructions:ai.value,dueDate:ad.value,maxMarks:Number(am.value),passingMarks:Number(ap.value),submissionType:ast.value});closeModal();createWizard()}

/* ==================== Learning, Progress, Quiz & Certificate ==================== */
function flatLessons(c){return c.modules.flatMap(m=>m.sections.flatMap(s=>s.lessons))}
function calcProgress(e,c){if(!e)return;let req=flatLessons(c).filter(l=>l.required);e.progress=req.length?Math.round(req.filter(l=>e.completedLessons.includes(l.id)).length/req.length*100):0;if(e.progress===100){e.status='Completed';ensureCertificate(e,c)}}
function learning(){let es=db.enrollments.filter(e=>e.studentId==='student1');app.innerHTML=`<div class="pagehead"><div><h1>My Learning</h1><div class="muted">Track your enrolled courses and continue where you left off.</div></div></div><div class="coursegrid">${es.map(e=>courseCard(db.courses.find(c=>c.id===e.courseId))).join('')||'<div class="card empty">Browse courses and enroll to start learning.</div>'}</div>`}
function openPlayer(cid){let c=db.courses.find(x=>x.id===cid),e=db.enrollments.find(x=>x.courseId===cid&&x.studentId==='student1');if(!e)return enroll(cid);state.selected=cid;state.currentLesson=flatLessons(c).find(l=>!e.completedLessons.includes(l.id))?.id||flatLessons(c)[0]?.id;go('player',cid)}
function player(){let c=db.courses.find(x=>x.id===state.selected),e=db.enrollments.find(x=>x.courseId===c.id&&x.studentId==='student1');calcProgress(e,c);let ls=flatLessons(c),l=ls.find(x=>x.id===state.currentLesson)||ls[0];if(!l){app.innerHTML='<div class="card empty">This course has no lessons yet.</div>';return}let idx=ls.findIndex(x=>x.id===l.id);app.innerHTML=`<div class="pagehead"><div><h1>${esc(c.title)}</h1><div class="muted">${e.completedLessons.length} / ${ls.length} lessons · ${e.progress}% complete</div></div><div style="min-width:220px"><div class="progress"><i style="width:${e.progress}%"></i></div></div></div><div class="player"><div><div class="viewer">${lessonView(l)}</div><div class="between" style="margin-top:14px"><button class="btn ghost" ${idx<=0?'disabled':''} onclick="selectLesson('${ls[idx-1]?.id||''}')">Previous Lesson</button><button class="btn primary" onclick="completeLesson('${l.id}')">${e.completedLessons.includes(l.id)?'Completed ✓':'Mark as Complete'}</button><button class="btn ghost" ${idx>=ls.length-1?'disabled':''} onclick="selectLesson('${ls[idx+1]?.id||''}')">Next Lesson</button></div>${courseQuizzes(c).map(q=>`<div class="card" style="margin-top:16px"><b>${esc(q.title)}</b><p class="muted">Passing score ${q.passingScore}%</p><button class="btn" onclick="attemptQuiz('${q.id}')">Attempt Quiz</button></div>`).join('')}</div><aside class="card curr"><h3>Course Curriculum</h3>${c.modules.map(m=>`<details open><summary><b>${esc(m.title)}</b></summary>${m.sections.map(s=>`<div><p class="muted">${esc(s.title)}</p>${s.lessons.map(x=>`<button class="btn ghost" style="width:100%;margin:4px 0;text-align:left" onclick="selectLesson('${x.id}')">${e.completedLessons.includes(x.id)?'✓':'○'} ${esc(x.title)}</button>`).join('')}</div>`).join('')}</details>`).join('')}</aside></div>${e.progress===100?`<div class="card" style="margin-top:18px"><h2>Course Completed 🎓</h2><p>Your certificate is unlocked.</p><button class="btn primary" onclick="go('certificates')">View Certificate</button></div>`:''}`}
function lessonView(l){if(l.type==='Video')return `<span class="badge">Video Lesson</span><h2>${esc(l.title)}</h2><div style="height:240px;display:grid;place-items:center;border:1px solid #334155;border-radius:14px;margin:20px 0">▶ Video Player${l.videoUrl?'<br>'+esc(l.videoUrl):''}</div><p>${esc(l.content)}</p>`;if(l.type==='Code Lesson')return `<span class="badge">Code Lesson</span><h2>${esc(l.title)}</h2><p>${esc(l.content)}</p><pre style="background:#020617;padding:18px;border-radius:12px;overflow:auto"><code>function learn() {\n  return "Build, test, improve";\n}</code></pre>`;if(['PDF','Document'].includes(l.type))return `<span class="badge">${l.type}</span><h2>${esc(l.title)}</h2><div style="height:300px;background:white;color:#334155;border-radius:12px;display:grid;place-items:center">Document Viewer Placeholder</div>`;return `<span class="badge">${esc(l.type)}</span><h2>${esc(l.title)}</h2><p style="font-size:17px">${esc(l.content)}</p>`}
function selectLesson(id){if(id){state.currentLesson=id;player()}}
function completeLesson(id){let c=db.courses.find(x=>x.id===state.selected),e=db.enrollments.find(x=>x.courseId===c.id&&x.studentId==='student1');if(!e.completedLessons.includes(id))e.completedLessons.push(id);calcProgress(e,c);save();toast('Progress updated');let ls=flatLessons(c),i=ls.findIndex(x=>x.id===id);if(ls[i+1])state.currentLesson=ls[i+1].id;player()}
function courseQuizzes(c){return c.modules.flatMap(m=>m.quizzes||[])}
function attemptQuiz(qid){let c=db.courses.find(x=>x.id===state.selected),q=courseQuizzes(c).find(x=>x.id===qid);modal(`<h2>${esc(q.title)}</h2><p>${esc(q.description)}</p><form id="quizForm">${q.questions.map((x,i)=>`<div class="field"><label>${i+1}. ${esc(x.text)} (${x.points} pts)</label>${x.options.map(o=>`<label style="display:block;font-weight:400"><input type="radio" name="q${i}" value="${esc(o)}"> ${esc(o)}</label>`).join('')}</div>`).join('')}<button type="button" class="btn primary" onclick="submitQuiz('${qid}')">Submit Quiz</button></form>`)}
function submitQuiz(qid){let c=db.courses.find(x=>x.id===state.selected),q=courseQuizzes(c).find(x=>x.id===qid),correct=0,total=q.questions.length;q.questions.forEach((x,i)=>{let v=document.querySelector(`input[name=q${i}]:checked`)?.value;if(x.correct.includes(v))correct++});let pct=total?Math.round(correct/total*100):0,pass=pct>=q.passingScore;db.attempts.push({id:uid('att'),studentId:'student1',courseId:c.id,quizId:qid,score:pct,correct,incorrect:total-correct,passed:pass,date:today()});save();modal(`<h2>Quiz Result</h2><div class="grid"><div class="metric"><small>Score</small><b>${pct}%</b></div><div class="metric"><small>Correct</small><b>${correct}</b></div><div class="metric"><small>Incorrect</small><b>${total-correct}</b></div><div class="metric"><small>Result</small><b>${pass?'PASS':'FAIL'}</b></div></div><button class="btn primary" style="margin-top:18px" onclick="closeModal()">Continue</button>`)}
function ensureCertificate(e,c){if(!c.certificateEnabled)return;if(!db.certificates.some(x=>x.courseId===c.id&&x.studentId===e.studentId)){db.certificates.push({id:'MTH-'+Date.now().toString().slice(-8),studentId:e.studentId,courseId:c.id,instructor:c.instructor,date:today()});toast('Certificate earned!')}}
function certificates(){let cs=db.role==='Student'?db.certificates.filter(x=>x.studentId==='student1'):db.certificates;app.innerHTML=`<div class="pagehead"><div><h1>Certificates</h1><div class="muted">Completion credentials issued by Murthu TechHub.</div></div></div>${cs.map(x=>{let c=db.courses.find(y=>y.id===x.courseId),u=db.users.find(y=>y.id===x.studentId);return `<div class="cert"><div class="brand">MURTHU TECHHUB</div><h1>Certificate of Completion</h1><p>This certifies that</p><h2>${esc(u?.name||'Student')}</h2><p>has successfully completed</p><h2>${esc(c?.title||'Course')}</h2><p>Instructor: ${esc(x.instructor)} · Completion Date: ${x.date}</p><p>Certificate ID: <b>${x.id}</b></p><button class="btn primary" onclick="window.print()">Print Certificate</button></div>`}).join('<br>')||'<div class="card empty">No certificates issued yet. Complete a course to unlock one.</div>'}`}

/* ==================== Admin Data Pages ==================== */
function students(){let us=db.users.filter(u=>u.role==='Student');app.innerHTML=`<div class="pagehead"><div><h1>Students</h1><div class="muted">Learner profiles, enrollments and progress.</div></div></div><table><thead><tr><th>Student</th><th>Email</th><th>Enrolled</th><th>Completed</th><th>Avg Progress</th><th>Status</th></tr></thead><tbody>${us.map(u=>{let es=db.enrollments.filter(e=>e.studentId===u.id);es.forEach(e=>calcProgress(e,db.courses.find(c=>c.id===e.courseId)));let avg=es.length?Math.round(es.reduce((a,e)=>a+e.progress,0)/es.length):0;return `<tr><td><b>${esc(u.name)}</b></td><td>${esc(u.email)}</td><td>${es.length}</td><td>${es.filter(e=>e.status==='Completed').length}</td><td>${avg}%</td><td><span class="badge ok">${u.status}</span></td></tr>`}).join('')}</tbody></table>`}
function enrollmentTable(es){return `<table><thead><tr><th>Student</th><th>Course</th><th>Enrollment Date</th><th>Progress</th><th>Status</th></tr></thead><tbody>${es.map(e=>{let c=db.courses.find(x=>x.id===e.courseId),u=db.users.find(x=>x.id===e.studentId);if(c)calcProgress(e,c);return `<tr><td>${esc(u?.name||e.studentId)}</td><td>${esc(c?.title||'Deleted Course')}</td><td>${e.enrolledAt}</td><td>${e.progress}%</td><td>${e.status}</td></tr>`}).join('')}</tbody></table>`}
function enrollments(){app.innerHTML=`<div class="pagehead"><div><h1>Enrollments</h1><div class="muted">Manage course access and learner progress.</div></div><button class="btn primary" onclick="demoEnroll()">Enroll Student</button></div>${enrollmentTable(db.enrollments)}`}
function demoEnroll(){let c=db.courses.find(c=>c.status==='Published'&&!db.enrollments.some(e=>e.courseId===c.id&&e.studentId==='student1'));if(!c)return toast('Demo student is enrolled in all available courses');db.enrollments.push({id:uid('enr'),studentId:'student1',courseId:c.id,enrolledAt:today(),completedLessons:[],progress:0,status:'Learning'});save();toast('Student enrolled');enrollments()}
function analytics(){let attempts=db.attempts,avg=attempts.length?Math.round(attempts.reduce((a,x)=>a+x.score,0)/attempts.length):0;app.innerHTML=`<div class="pagehead"><div><h1>LMS Analytics</h1><div class="muted">Learning performance and engagement.</div></div><select class="role"><option>30 Days</option><option>Today</option><option>7 Days</option><option>This Month</option><option>This Year</option></select></div><div class="grid">${[['Total Learners',db.users.filter(u=>u.role==='Student').length],['Active Learners',db.enrollments.filter(e=>e.status==='Learning').length],['Enrollments',db.enrollments.length],['Completion Rate',db.enrollments.length?Math.round(db.enrollments.filter(e=>e.status==='Completed').length/db.enrollments.length*100)+'%':'0%'],['Avg Quiz Score',avg+'%'],['Certificates',db.certificates.length],['Learning Hours',Math.round(db.enrollments.reduce((a,e)=>a+e.completedLessons.length*.35,0))],['Courses',db.courses.length]].map(x=>`<div class="card metric"><small>${x[0]}</small><b>${x[1]}</b></div>`).join('')}</div><div class="two" style="margin-top:18px"><div class="card"><h2>Completion Trend</h2><div class="chart">${[25,45,38,60,72,68,85].map(x=>`<i class="bar" style="height:${x}%"></i>`).join('')}</div></div><div class="card"><h2>Course Engagement</h2>${db.courses.slice(0,5).map(c=>`<p>${esc(c.title)}</p><div class="progress"><i style="width:${Math.min(100,30+c.rating*12)}%"></i></div>`).join('')}</div></div>`}
function categories(){app.innerHTML=`<div class="pagehead"><div><h1>Categories</h1></div><button class="btn primary" onclick="let x=prompt('Category name');if(x){db.categories.push(x);save();categories()}">+ Add Category</button></div><div class="grid">${db.categories.map(x=>`<div class="card"><b>${esc(x)}</b><p class="muted">${db.courses.filter(c=>c.category===x).length} courses</p></div>`).join('')}</div>`}
function instructors(){let us=db.users.filter(u=>u.role==='Instructor');app.innerHTML=`<div class="pagehead"><div><h1>Instructors</h1></div></div><div class="grid">${us.map(u=>`<div class="card"><h3>${esc(u.name)}</h3><p>${esc(u.email)}</p><p class="muted">${db.courses.filter(c=>c.instructor===u.name).length} courses</p></div>`).join('')}</div>`}
function allAssignments(){return db.courses.flatMap(c=>c.modules.flatMap(m=>(m.assignments||[]).map(a=>({...a,courseId:c.id,courseTitle:c.title}))))}
function assignments(){let as=allAssignments();app.innerHTML=`<div class="pagehead"><div><h1>Assignments</h1><div class="muted">Course assignments and submissions.</div></div></div>${as.length?`<table><thead><tr><th>Assignment</th><th>Course</th><th>Due</th><th>Max Marks</th><th>Submissions</th></tr></thead><tbody>${as.map(a=>`<tr><td>${esc(a.title)}</td><td>${esc(a.courseTitle)}</td><td>${a.dueDate||'Open'}</td><td>${a.maxMarks}</td><td>${db.submissions.filter(s=>s.assignmentId===a.id).length}</td></tr>`).join('')}</tbody></table>`:'<div class="card empty">No assignments created.</div>'}`}
function quizzes(){let qs=db.courses.flatMap(c=>courseQuizzes(c).map(q=>({...q,courseTitle:c.title})));app.innerHTML=`<div class="pagehead"><div><h1>Quizzes & Results</h1></div></div>${qs.map(q=>`<div class="card" style="margin-bottom:12px"><div class="between"><div><b>${esc(q.title)}</b><div class="muted">${esc(q.courseTitle)} · ${q.questions.length} questions · Pass ${q.passingScore}%</div></div><span class="badge">${db.attempts.filter(a=>a.quizId===q.id).length} attempts</span></div></div>`).join('')||'<div class="card empty">No quizzes created.</div>'}`}

/* ==================== Profile & Settings ==================== */
function profile(){let u=db.users.find(x=>x.id==='student1');app.innerHTML=`<div class="pagehead"><div><h1>Student Profile</h1></div><button class="btn primary" onclick="editProfile()">Edit Profile</button></div><div class="two"><div class="card"><div style="width:90px;height:90px;border-radius:50%;background:#e0e7ff;display:grid;place-items:center;font-size:32px">DS</div><h2>${esc(u.name)}</h2><p>${esc(u.email)}</p><p>${esc(u.bio)}</p><h3>Skills</h3><div class="row">${u.skills.map(x=>`<span class="badge">${esc(x)}</span>`).join('')}</div><h3>Learning Interests</h3><p>${u.interests.map(esc).join(', ')}</p></div><div class="card"><h2>Learning Statistics</h2><p>Courses enrolled: <b>${db.enrollments.filter(e=>e.studentId===u.id).length}</b></p><p>Certificates: <b>${db.certificates.filter(c=>c.studentId===u.id).length}</b></p><p>Quiz attempts: <b>${db.attempts.filter(a=>a.studentId===u.id).length}</b></p></div></div>`}
function editProfile(){let u=db.users.find(x=>x.id==='student1');modal(`<h2>Edit Profile</h2><div class="field"><label>Name</label><input id="pn" value="${esc(u.name)}"></div><div class="field"><label>Bio</label><textarea id="pb">${esc(u.bio)}</textarea></div><button class="btn primary" onclick="u=db.users.find(x=>x.id==='student1');u.name=pn.value;u.bio=pb.value;save();closeModal();profile();toast('Profile updated')">Save Profile</button>`)}
function settings(){let s=db.settings;app.innerHTML=`<div class="pagehead"><div><h1>Settings</h1><div class="muted">Platform, course, enrollment and notification configuration.</div></div></div><div class="card"><h2>General Settings</h2><div class="two"><div class="field"><label>Platform Name</label><input id="sp" value="${esc(s.platform)}"></div><div class="field"><label>Support Email</label><input id="se" value="${esc(s.support)}"></div><div class="field"><label>Default Language</label><select id="sl"><option>English</option><option>Telugu</option><option>Hindi</option></select></div><div class="field"><label>Default Currency</label><input value="INR (₹)" disabled></div></div><h3>Course & Notification Settings</h3><p><label><input id="sen" type="checkbox" ${s.enrollment?'checked':''}> Enrollment enabled</label></p><p><label><input id="sc" type="checkbox" ${s.certificates?'checked':''}> Certificates enabled</label></p><p><label><input id="sn" type="checkbox" ${s.notifications?'checked':''}> Notifications enabled</label></p><button class="btn primary" onclick="saveSettings()">Save Settings</button></div>`}
function saveSettings(){db.settings.platform=sp.value;db.settings.support=se.value;db.settings.language=sl.value;db.settings.enrollment=sen.checked;db.settings.certificates=sc.checked;db.settings.notifications=sn.checked;save();toast('Settings saved')}

/* Init */
save();render();
</script>
</body>
</html>
